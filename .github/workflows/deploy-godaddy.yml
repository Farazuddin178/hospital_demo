# Builds the static site and uploads it to GoDaddy hosting over FTP on every
# push to main. Until the FTP secrets below are added, it only builds, which
# still catches a broken build before anyone uploads it by hand.
#
# Repository > Settings > Secrets and variables > Actions:
#   Secrets:   FTP_SERVER     e.g. ftp.yourdomain.com (cPanel > FTP Accounts)
#              FTP_USERNAME
#              FTP_PASSWORD
#              SMTP_PASSWORD  password of info@oxygen-hospital.com, so the website
#                             forms can send email (optional; see public/api/_mailer.php)
#   Variables: SITE_URL       e.g. https://www.yourdomain.com (optional)
#              FTP_SERVER_DIR folder to upload into (optional). Normally leave
#                             unset: the upload finds public_html by itself,
#                             whether the FTP login opens in the home folder
#                             or already inside public_html.
#              FTP_PROTOCOL   ftps (default) or ftp if FTPS is refused
#              GA_ID          Google Analytics ID (optional)
#              API_URL        a backend for the forms, once one exists (optional)

name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godaddy-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_CONFIGURED: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build:static
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}

      # The forms sign in to the info@ mailbox to send email. Its password comes
      # from a GitHub secret and is written only into the uploaded copy, never
      # into the repository. GitHub masks it in the logs.
      - name: Add mail settings
        if: env.FTP_CONFIGURED == 'true'
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: node scripts/write-mail-config.mjs

      # lftp's mirror creates each folder as it goes and logs every file, so a
      # failure names the exact path. Nothing on the server is deleted, which
      # keeps cPanel's own files (.well-known for SSL renewal, cgi-bin) safe.
      - name: Upload to GoDaddy
        if: env.FTP_CONFIGURED == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null

          if [ "$FTP_PROTOCOL" = "ftp" ]; then SSL=no; else SSL=yes; fi
          # GoDaddy's FTP certificate is issued to the server's own hostname,
          # not ftp.yourdomain.com, so it cannot pass a name check. The
          # connection is still encrypted.
          SETTINGS="set ftp:ssl-allow $SSL; set ftp:ssl-force $SSL; set ftp:ssl-protect-data $SSL; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5"
          SERVER="${FTP_SERVER#ftp://}"
          SERVER="${SERVER%/}"
          # -c exits with the status of the last command, so a failed cd or
          # upload fails the step. The password comes from LFTP_PASSWORD.
          ftp_run() { lftp -c "$SETTINGS; open --env-password -u '$FTP_USERNAME' 'ftp://$SERVER'; $1"; }

          if [ -n "$FTP_SERVER_DIR" ]; then
            TARGET="$FTP_SERVER_DIR"
          elif ftp_run "cd public_html" > /dev/null 2>&1; then
            TARGET="public_html"   # login opens in the account's home folder
          else
            TARGET="."             # login already opens inside public_html
          fi
          echo "Uploading ./out to '$TARGET'"

          # Two passes so visitors never see a half-updated site. Pass 1 uploads
          # the new stylesheets, scripts and images while the old pages keep
          # pointing at the old ones (old files are never deleted). Pass 2 then
          # swaps in the pages (.html, plus the .txt data Next.js loads when
          # moving between pages), which reference files that already exist.
          ftp_run "mirror --reverse --verbose --no-perms --parallel=4 --exclude-glob *.html --exclude-glob *.txt out/ '$TARGET'"
          ftp_run "mirror --reverse --verbose --no-perms --parallel=4 out/ '$TARGET'"

      - name: Upload skipped
        if: env.FTP_CONFIGURED != 'true'
        run: echo "::notice::Built ./out but did not upload. Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to deploy to GoDaddy."
